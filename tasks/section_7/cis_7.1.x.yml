- name: "7.1.10 | PATCH | Ensure access to /etc/security/opasswd is configured"
  when: amzn2027cis_rule_7_1_10
  tags:
    - level1-server
    - automated
    - patch
    - permissions
    - rule_7.1.10
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "7.1.10 | AUDIT | Ensure access to /etc/security/opasswd is configured | Check files exist"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/security/opasswd
        - /etc/security/opasswd.old
      register: discovered_opasswd_files

    - name: "7.1.10 | PATCH | Ensure access to /etc/security/opasswd is configured | Set owner, group and mode"
      when: item.stat.exists
      ansible.builtin.file:
        path: "{{ item.item }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      loop: "{{ discovered_opasswd_files.results }}"

- name: "7.1.11 | PATCH | Ensure world writable files and directories are secured"
  when: amzn2027cis_rule_7_1_11
  tags:
    - level1-server
    - automated
    - patch
    - files
    - permissions
    - NIST800-53R5_SC-4
    - rule_7.1.11
  block:
    - name: "7.1.11 | AUDIT | Ensure world writable files and directories are secured | Get list of world-writable files"
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type f -perm -0002
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      failed_when: false
      changed_when: false
      check_mode: false
      register: discovered_world_writable

    - name: "7.1.11 | PATCH | Ensure world writable files and directories are secured | Adjust world-writable files if they exist (Configurable)"
      when:
        - discovered_world_writable.stdout_lines is defined
        - discovered_world_writable.stdout_lines | length > 0
        - amzn2027cis_no_world_write_adjust
      ansible.builtin.file:
        path: '{{ item }}'
        mode: 'o-w'
        state: touch
      loop: "{{ discovered_world_writable.stdout_lines }}"

    - name: "7.1.11 | PATCH | Ensure world writable files and directories are secured | Adjust world-writable directories add sticky bit"
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type d -perm -o+w ! -perm -1002 2>/dev/null | xargs chmod a+t
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      failed_when: discovered_set_stickybit.rc not in [ 0, 123 ]
      changed_when: discovered_set_stickybit.rc == 0
      register: discovered_set_stickybit

- name: "7.1.12 | PATCH | Ensure no files or directories without an owner and a group exist"
  when: amzn2027cis_rule_7_1_12
  tags:
    - level1-server
    - automated
    - patch
    - NIST800-53R5_CM-6
    - rule_7.1.12
    - permissions
  block:
    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Get list files or directories"
      ansible.builtin.command: "find {{ item.mount }} -xdev {{ amzn2027cis_exclude_unowned_search_path }} \\( -nouser -o -nogroup \\) -not -fstype nfs"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_unowned_files
      with_items:
        - "{{ ansible_facts['mounts'] }}"

    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Flatten no_user_items results for easier use"
      ansible.builtin.set_fact:
        discovered_unowned_files_flatten: "{{ discovered_unowned_files.results | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Alert on unowned files and directories"
      when:
        - not amzn2027cis_ownership_adjust
        - discovered_unowned_files_flatten | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have unowned files and are configured to not auto-remediate for this task"
          - "Please review the files/directories below and assign an owner"
          - "{{ discovered_unowned_files_flatten }}"

    - name: "7.1.12 | PATCH | Ensure no files or directories without an owner and a group exist | Set files/directories to configured owner and group"
      when:
        - amzn2027cis_ownership_adjust
        - discovered_unowned_files_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ amzn2027cis_unowned_owner }}"
        group: "{{ amzn2027cis_ungrouped_group }}"
      with_items:
        - "{{ discovered_unowned_files_flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Warn Count"
      when:
        - not amzn2027cis_ownership_adjust
        - discovered_unowned_files_flatten | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '7.1.12'

- name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed"
  when: amzn2027cis_rule_7_1_13
  tags:
    - level1-server
    - manual
    - audit
    - patch
    - NIST800-53R5_AC-6
    - rule_7.1.13
    - permissions
  block:
    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Find SUID and SGID"
      ansible.builtin.command: find {{ item.mount }} -xdev -type f \( -perm -02000 -o -perm -04000 \) -not -fstype nfs
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_suid_sgid_files
      with_items:
        - "{{ ansible_facts['mounts'] }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Flatten suid_executables results for easier use"
      ansible.builtin.set_fact:
        discovered_suid_sgid_files_flatten: "{{ discovered_suid_sgid_files.results | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Alert SUID executables exist"
      when:
        - discovered_suid_sgid_files_flatten | length > 0
        - not amzn2027cis_suid_sgid_adjust
      ansible.builtin.debug:
        msg:
          - "Warning!! You have SUID executables"
          - "The files are listed below, please confirm the integrity of these binaries"
          - "{{ discovered_suid_sgid_files_flatten }}"

    - name: "7.1.13 | PATCH | Ensure SUID and SGID files are reviewed | Remove SUID bit"
      when:
        - amzn2027cis_suid_sgid_adjust
        - discovered_suid_sgid_files_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'u-s'
      with_items:
        - "{{ discovered_suid_sgid_files_flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '7.1.13'
      when:
        - discovered_suid_sgid_files_flatten | length > 0
        - not amzn2027cis_suid_sgid_adjust
