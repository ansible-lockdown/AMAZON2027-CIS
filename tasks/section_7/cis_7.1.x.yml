---

- name: "7.1.1 | PATCH | Ensure access to /etc/passwd is configured"
  when: amzn2027cis_rule_7_1_1
  tags:
    - level1-server
    - automated
    - patch
    - permissions
    - rule_7.1.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: 'u-x,go-wx'

- name: "7.1.2 | PATCH | Ensure access to /etc/passwd- is configured"
  when: amzn2027cis_rule_7_1_2
  tags:
    - level1-server
    - automated
    - patch
    - permissions
    - rule_7.1.2
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "7.1.2 | AUDIT | Ensure access to /etc/passwd- is configured | Check file exists"
      ansible.builtin.stat:
        path: /etc/passwd-
      register: discovered_passwd_backup_file

    - name: "7.1.2 | PATCH | Ensure access to /etc/passwd- is configured | Set owner, group and mode"
      when: discovered_passwd_backup_file.stat.exists
      ansible.builtin.file:
        path: /etc/passwd-
        owner: root
        group: root
        mode: 'u-x,go-wx'

