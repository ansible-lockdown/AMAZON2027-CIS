---

- name: "1.1.1.1 | PATCH | Ensure overlay kernel module is not available"
  when: amzn2027cis_rule_1_1_1_1
  tags:
    - level2-server
    - automated
    - patch
    - rule_1.1.1.1
    - overlay
    - CCI-000381
    - NIST800-53R5_CM-7
  block:
    - name: "1.1.1.1 | PATCH | Ensure overlay kernel module is not available | Edit modprobe config"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install overlay(\\s|$)"
        line: "install overlay /bin/true"
        create: true
        mode: 'go-rwx'

    - name: "1.1.1.1 | PATCH | Ensure overlay kernel module is not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: "^(#)?blacklist overlay(\\s|$)"
        line: "blacklist overlay"
        create: true
        mode: 'go-rwx'

    - name: "1.1.1.1 | PATCH | Ensure overlay kernel module is not available | Disable overlay"
      when: not system_is_container
      community.general.modprobe:
        name: overlay
        state: absent

