- name: "1.1.1.5 | PATCH | Ensure unused filesystems kernel modules are not available"
  when: amzn2027cis_rule_1_1_1_5
  tags:
    - level1-server
    - manual
    - patch
    - rule_1.1.1.5
    - NIST800-53R5_CM-7
  block:
    - name: "1.1.1.5 | PATCH | Ensure unused filesystems kernel modules are not available | Add discovery script"
      ansible.builtin.copy:
        src: fs_with_cves.sh
        dest: "{{ amzn2027cis_temp_exec_location }}/fs_with_cves.sh"
        owner: root
        group: root
        mode: 'u+x,go-wx'

    - name: "1.1.1.5 | AUDIT | Ensure unused filesystems kernel modules are not available | Run discovery script"
      ansible.builtin.command: "{{ amzn2027cis_temp_exec_location }}/fs_with_cves.sh"
      changed_when: false
      check_mode: false
      failed_when: discovered_fs_modules_loaded.rc not in [ 0, 99 ]
      register: discovered_fs_modules_loaded

    - name: "1.1.1.5 | AUDIT | Ensure unused filesystems kernel modules are not available | Output Warning"
      when: discovered_fs_modules_loaded.stdout | length > 0
      ansible.builtin.debug:
        msg: "{{ ['Warning!! Discovered loaded Filesystem modules that need attention. This is a manual task'] + discovered_fs_modules_loaded.stdout_lines }}"

    - name: "1.1.1.5 | AUDIT | Ensure unused filesystems kernel modules are not available | Capture Warning"
      when: discovered_fs_modules_loaded.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.1.1.5'

    - name: "1.1.1.5 | PATCH | Ensure unused filesystems kernel modules are not available | Remove script"
      when: amzn2027cis_remove_kernel_discovery_script
      ansible.builtin.file:
        path: "{{ amzn2027cis_temp_exec_location }}/fs_with_cves.sh"
        state: absent
