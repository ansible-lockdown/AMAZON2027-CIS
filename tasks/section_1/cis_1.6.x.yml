- name: "1.6.7 | PATCH | Ensure system wide crypto policy enables post-quantum algorithms"
  when:
    - amzn2027cis_rule_1_6_7
    - "'PQ' not in amzn2027cis_crypto_policy_module"
    - amzn2027cis_crypto_policy_ansiblemanaged
  tags:
    - level2-server
    - automated
    - patch
    - crypto
    - rule_1.6.7
    - NIST800-53R5_SC-13
  block:
    - name: "1.6.7 | AUDIT | Ensure system wide crypto policy enables post-quantum algorithms | Check PQ subpolicy is available"
      ansible.builtin.stat:
        path: /usr/share/crypto-policies/policies/modules/PQ.pmod
      register: discovered_crypto_pq_module

    - name: "1.6.7 | PATCH | Ensure system wide crypto policy enables post-quantum algorithms | submodule to crypto policy modules"
      when: discovered_crypto_pq_module.stat.exists
      ansible.builtin.set_fact:
        amzn2027cis_crypto_policy_module: "{{ amzn2027cis_crypto_policy_module + ':' + 'PQ' }}"
      changed_when: "'PQ' not in prelim_system_wide_crypto_policy.stdout.split(':')"
      notify:
        - Update Crypto Policy
        - Set Crypto Policy

    - name: "1.6.7 | AUDIT | Ensure system wide crypto policy enables post-quantum algorithms | Warn if NO-PQ subpolicy is requested"
      when: "'NO-PQ' in amzn2027cis_additional_crypto_policy_module.split(':')"
      block:
        - name: "1.6.7 | AUDIT | Ensure system wide crypto policy enables post-quantum algorithms | Warn if NO-PQ subpolicy is requested | Message"
          ansible.builtin.debug:
            msg: "Warning!! amzn2027cis_additional_crypto_policy_module includes NO-PQ, which removes the ML-KEM and ML-DSA algorithms the base policy enables. Remove NO-PQ to conform to 1.6.7"

        - name: "1.6.7 | AUDIT | Ensure system wide crypto policy enables post-quantum algorithms | Warn if NO-PQ subpolicy is requested | Warn count"
          ansible.builtin.import_tasks:
            file: warning_facts.yml
          vars:
            warn_control_id: '1.6.7'
