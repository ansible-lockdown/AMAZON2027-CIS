---

- name: "1.6.1 | PATCH | Ensure system wide crypto policy is not legacy"
  when:
    - amzn2027cis_rule_1_6_1
    - amzn2027cis_crypto_policy_ansiblemanaged
  tags:
    - level1-server
    - automated
    - patch
    - crypto
    - rule_1.6.1
    - NIST800-53R5_SC-6
  ansible.builtin.debug:
    msg: "Captured in prelim to ensure not LEGACY. Runs handler to update"
  changed_when: prelim_system_wide_crypto_policy.stdout.split(':')[0] != amzn2027cis_crypto_policy
  notify:
    - Update Crypto Policy
    - Set Crypto Policy

- name: "1.6.2 | PATCH | Ensure system wide crypto policy disables sha1 hash and signature support | Add submodule exclusion"
  when:
    - amzn2027cis_rule_1_6_2
    - "'NO-SHA1' not in amzn2027cis_crypto_policy_module"
    - amzn2027cis_crypto_policy_ansiblemanaged
  tags:
    - level1-server
    - automated
    - patch
    - crypto
    - rule_1.6.2
    - NIST800-53R5_SC-6
  block:
    - name: "1.6.2 | PATCH | Ensure system wide crypto policy disables sha1 hash and signature support"
      ansible.builtin.template:
        src: etc/crypto-policies/policies/modules/NO-SHA1.pmod.j2
        dest: /etc/crypto-policies/policies/modules/NO-SHA1.pmod
        owner: root
        group: root
        mode: 'g-wx,o-rwx'
      register: discovered_no_sha1_template

    - name: "1.6.2 | PATCH | Ensure system wide crypto policy disables sha1 hash and signature support | submodule to crypto policy modules"
      ansible.builtin.set_fact:
        amzn2027cis_crypto_policy_module: "{{ amzn2027cis_crypto_policy_module + ':' + 'NO-SHA1' }}"
      changed_when: discovered_no_sha1_template is changed or 'NO-SHA1' not in prelim_system_wide_crypto_policy.stdout.split(':')  # noqa: no-handler
      notify:
        - Update Crypto Policy
        - Set Crypto Policy

