---

- name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured"
  when: amzn2027cis_rule_1_5_1
  tags:
    - level1-server
    - automated
    - patch
    - sysctl
    - CCI-002165
    - CCI-002235
    - NIST800-53R5_AC-3_4
    - NIST800-53R5_AC-6_10
    - rule_1.5.1
  block:
    - name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured | Set sysctl update"
      ansible.builtin.set_fact:
        amzn2027cis_sysctl_update: true

    - name: "1.5.1 | AUDIT | Ensure fs.protected_hardlinks is configured | Find files setting fs.protected_hardlinks"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Els -- '^[[:space:]]*fs[.]protected_hardlinks[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/*.conf
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_sysctl_fs_protected_hardlinks.rc not in [ 0, 1, 2 ]
      register: discovered_sysctl_fs_protected_hardlinks

    - name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured | Comment out conflicting entries"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([ \t]*fs\.protected_hardlinks[ \t]*=[ \t]*(?![ \t]|1[ \t]*$).*)$'
        replace: '# \1'
      loop: "{{ discovered_sysctl_fs_protected_hardlinks.stdout_lines }}"
      notify: Reload sysctl

