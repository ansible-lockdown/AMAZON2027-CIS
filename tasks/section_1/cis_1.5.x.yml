- name: "1.5.8 | PATCH | Ensure core file size is configured"
  when: amzn2027cis_rule_1_5_8
  tags:
    - level1-server
    - automated
    - patch
    - limits
    - rule_1.5.8
    - CCI-000366
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.8 | AUDIT | Ensure core file size is configured | Find conflicting entries"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Pls -- '^[ \t]*[^#\s]+\s+hard\s+core\s+(?!0[ \t]*$)\S+' /etc/security/limits.conf /etc/security/limits.d/*.conf
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_hard_core_limits.rc not in [ 0, 1, 2 ]
      register: discovered_hard_core_limits

    - name: "1.5.8 | PATCH | Ensure core file size is configured | Comment out conflicting entries"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([ \t]*[^#\s]+\s+hard\s+core\s+(?!0[ \t]*$)\S+.*)$'
        replace: '# \1'
      loop: "{{ discovered_hard_core_limits.stdout_lines }}"

    - name: "1.5.8 | PATCH | Ensure core file size is configured | Set hard core limit"
      ansible.builtin.lineinfile:
        path: /etc/security/limits.d/60-limits.conf
        regexp: '^\s*#?\s*\*\s+hard\s+core\s'
        line: '* hard core 0'
        owner: root
        group: root
        mode: 'u-x,go-wx'
        create: true

- name: "1.5.9 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured"
  when:
    - amzn2027cis_rule_1_5_9
    - prelim_systemd_coredump.stat.exists
  tags:
    - level1-server
    - automated
    - patch
    - rule_1.5.9
    - CCI-000366
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.9 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | Drop-in directory"
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        owner: root
        group: root
        mode: 'go-w'
        state: directory

    - name: "1.5.9 | AUDIT | Ensure systemd-coredump ProcessSizeMax is configured | Find conflicting entries"
      ansible.builtin.find:
        paths: /etc/systemd/coredump.conf.d
        patterns: '*.conf'
        excludes: 60-coredump.conf
        contains: '[ \t]*ProcessSizeMax[ \t]*=[ \t]*(?![ \t]|0[ \t]*$)'
      register: discovered_coredump_processsizemax

    - name: "1.5.9 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | Comment out conflicting entries"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^([ \t]*ProcessSizeMax[ \t]*=[ \t]*(?![ \t]|0[ \t]*$).*)$'
        replace: '# \1'
      loop: "{{ discovered_coredump_processsizemax.files }}"

    - name: "1.5.9 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | Set ProcessSizeMax"
      community.general.ini_file:
        path: /etc/systemd/coredump.conf.d/60-coredump.conf
        section: Coredump
        option: ProcessSizeMax
        value: '0'
        no_extra_spaces: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
        create: true

