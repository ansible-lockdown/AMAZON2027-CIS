- name: "1.8.6 | PATCH | Ensure XDMCP is not enabled"
  when:
    - amzn2027cis_rule_1_8_6
    - amzn2027cis_gui
  tags:
    - level1-server
    - automated
    - patch
    - gui
    - NIST800-53R5_SI-4
    - rule_1.8.6
  ansible.builtin.lineinfile:
    path: /etc/gdm/custom.conf
    regexp: '^\s*Enable\s*=\s*true'
    state: absent

- name: "1.8.7 | PATCH | Ensure Wayland is configured"
  when:
    - amzn2027cis_rule_1_8_7
    - amzn2027cis_gui
    - "'gdm' in ansible_facts['packages']"
  tags:
    - level1-server
    - automated
    - patch
    - gui
    - rule_1.8.7
    - NIST800-53R5_CM-6
  ansible.builtin.replace:
    path: /etc/gdm/custom.conf
    regexp: '(?i)^([ \t]*WaylandEnable\s*=\s*false\b.*)$'
    replace: '# \1'
