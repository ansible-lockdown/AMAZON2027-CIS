---

- name: "1.2.1.1 | AUDIT | Ensure GPG keys are configured"
  when: amzn2027cis_rule_1_2_1_1
  tags:
    - level1-server
    - manual
    - audit
    - rule_1.2.1.1
    - NIST800-53R5_SI-2
  block:
    - name: "1.2.1.1 | AUDIT | Ensure GPG keys are configured | List installed pubkey keys"
      ansible.builtin.shell: |
        set -o pipefail
        rpm -qa | grep {{ os_gpg_key_pubkey_name }}  # noqa command-instead-of-module
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_os_installed_pub_keys

    - name: "1.2.1.1 | AUDIT | Ensure GPG keys are configured | Query found keys"
      when: discovered_os_installed_pub_keys.rc == 0
      ansible.builtin.shell: |
        set -o pipefail
        rpm -q --queryformat "%{SUMMARY}\\n" {{ os_gpg_key_pubkey_name }} | grep "{{ os_gpg_key_pubkey_content }}"  # noqa command-instead-of-module
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_os_gpg_key_check

    - name: "1.2.1.1 | AUDIT | Ensure GPG keys are configured | If expected keys fail"
      when:
        - discovered_os_installed_pub_keys.rc == 1 or
          discovered_os_gpg_key_check.rc == 1
      ansible.builtin.fail:
        msg: Installed GPG Keys do not meet expected values or expected keys are not installed

- name: "1.2.1.2 | PATCH | Ensure gpgcheck is configured"
  when: amzn2027cis_rule_1_2_1_2
  tags:
    - level1-server
    - automated
    - patch
    - rule_1.2.1.2
    - NIST800-53R5_SI-2
  block:
    - name: "1.2.1.2 | PATCH | Ensure gpgcheck is configured | libdnf5 drop-in"
      community.general.ini_file:
        path: /etc/dnf/libdnf5.conf.d/60-cis.conf
        section: main
        option: pkg_gpgcheck
        value: '1'
        no_extra_spaces: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
        create: true

    - name: "1.2.1.2 | PATCH | Ensure gpgcheck is configured | Remove disabling entries from dnf.conf"
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '(?i)^\s*(pkg_)?gpgcheck\s*=\s*(0|false|no)\b'
        state: absent

    - name: "1.2.1.2 | AUDIT | Ensure gpgcheck is configured | Find repos"
      ansible.builtin.find:
        paths:
          - /etc/yum.repos.d
          - /etc/yum/repos.d
          - /etc/distro.repos.d
          - /etc/dnf/repos.override.d
        patterns: "*.repo"
      register: discovered_yum_repos

    - name: "1.2.1.2 | PATCH | Ensure gpgcheck is configured | Update yum.repos"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '(?i)^\s*(pkg_)?gpgcheck\s*=\s*(0|false|no)\b'
        replace: '\1gpgcheck=1'
      loop: "{{ discovered_yum_repos.files }}"

- name: "1.2.1.3 | PATCH | Ensure repo_gpgcheck is configured"
  when: amzn2027cis_rule_1_2_1_3
  tags:
    - level2-server
    - automated
    - patch
    - rule_1.2.1.3
    - NIST800-53R5_SI-2
  block:
    - name: "1.2.1.3 | PATCH | Ensure repo_gpgcheck is configured | libdnf5 drop-in"
      community.general.ini_file:
        path: /etc/dnf/libdnf5.conf.d/60-cis.conf
        section: main
        option: repo_gpgcheck
        value: '1'
        no_extra_spaces: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
        create: true

    - name: "1.2.1.3 | PATCH | Ensure repo_gpgcheck is configured | Remove disabling entries from dnf.conf"
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '(?i)^\s*repo_gpgcheck\s*=\s*(0|false|no)\b'
        state: absent

- name: "1.2.1.3 | PATCH | Ensure repo_gpgcheck is configured | Repository files"
  when:
    - amzn2027cis_rule_1_2_1_3
    - amzn2027cis_enable_repogpg
  tags:
    - level2-server
    - automated
    - patch
    - rule_1.2.1.3
    - NIST800-53R5_SI-2
  block:
    - name: "1.2.1.3 | AUDIT | Ensure repo_gpgcheck is configured | get repo files"
      ansible.builtin.find:
        paths:
          - /etc/yum.repos.d
          - /etc/yum/repos.d
          - /etc/distro.repos.d
          - /etc/dnf/repos.override.d
        patterns: "*.repo"
      register: discovered_repo_files

    - name: "1.2.1.3 | PATCH | Ensure repo_gpgcheck is configured | amend repo files"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '(?i)^\s*repo_gpgcheck\s*=\s*(0|false|no)\b'
        replace: repo_gpgcheck=1
      loop: "{{ discovered_repo_files.files }}"

- name: "1.2.1.4 | AUDIT | Ensure package manager repositories are configured"
  when: amzn2027cis_rule_1_2_1_4
  tags:
    - level1-server
    - manual
    - audit
    - rule_1.2.1.4
    - NIST800-53R5_SI-2
  block:
    - name: "1.2.1.4 | AUDIT | Ensure package manager repositories are configured | Get repo list"
      ansible.builtin.command: dnf repolist
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dnf_configured

    - name: "1.2.1.4 | AUDIT | Ensure package manager repositories are configured | Display repo list"
      ansible.builtin.debug:
        msg:
          - "Warning!! Below are the configured repos. Please review and make sure all align with site policy"
          - "{{ discovered_dnf_configured.stdout_lines }}"

    - name: "1.2.1.4 | AUDIT | Ensure package manager repositories are configured | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.2.1.4'

- name: "1.2.1.5 | PATCH | Ensure weak dependencies are configured"
  when: amzn2027cis_rule_1_2_1_5
  tags:
    - level2-server
    - automated
    - patch
    - rule_1.2.1.5
    - NIST800-53R5_CM-7
  block:
    - name: "1.2.1.5 | PATCH | Ensure weak dependencies are configured | libdnf5 drop-in"
      community.general.ini_file:
        path: /etc/dnf/libdnf5.conf.d/60-cis.conf
        section: main
        option: install_weak_deps
        value: '0'
        no_extra_spaces: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
        create: true

    - name: "1.2.1.5 | PATCH | Ensure weak dependencies are configured | Remove enabling entries from dnf.conf"
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '(?i)^\s*install_weak_deps\s*=\s*(1|true|yes)\b'
        state: absent
