---

- name: "6.1.1.1 | PATCH | Ensure journald service is active"
  when: amzn2027cis_rule_6_1_1_1
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - CCI-001665
    - NIST800-53R5_SC-24
    - rule_6.1.1.1
  ansible.builtin.systemd:
    name: systemd-journald.service
    masked: false
    state: started

- name: "6.1.1.2 | PATCH | Ensure systemd-journal-remote is not in use"
  when:
    - not amzn2027cis_system_is_log_server
    - amzn2027cis_rule_6_1_1_2
    - "'systemd-journal-remote' in ansible_facts['packages']"
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - rule_6.1.1.2
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service

- name: "6.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog"
  when: amzn2027cis_rule_6_1_1_3
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - NIST800-53R5_AU-6
    - rule_6.1.1.3
  notify: Restart journald
  block:
    - name: "6.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | Comment out ForwardToSyslog in journald.conf"
      when: prelim_systemd_journald_conf.stat.exists
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: '^(\s*ForwardToSyslog\s*=.*)'
        replace: '#\1'

    - name: "6.1.1.3 | AUDIT | Ensure journald is configured to send logs to rsyslog | Find other drop-ins setting ForwardToSyslog"
      ansible.builtin.find:
        paths: /etc/systemd/journald.conf.d
        patterns: '*.conf'
        excludes: '60-forwardtosyslog.conf'
        contains: '^\s*ForwardToSyslog\s*='
      register: discovered_journald_forward_dropins

    - name: "6.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | Comment out ForwardToSyslog in other drop-ins"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*ForwardToSyslog\s*=.*)'
        replace: '#\1'
      loop: "{{ discovered_journald_forward_dropins.files }}"

    - name: "6.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | Ensure drop-in directory exists"
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: 'go-w'

    - name: "6.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | Add drop-in"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/60-forwardtosyslog.conf.j2
        dest: /etc/systemd/journald.conf.d/60-forwardtosyslog.conf
        owner: root
        group: root
        mode: 'u-x,go-wx'

- name: "6.1.1.4 | PATCH | Ensure journald log file rotation is configured"
  when: amzn2027cis_rule_6_1_1_4
  tags:
    - level1-server
    - manual
    - patch
    - journald
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
    - rule_6.1.1.4
  notify: Restart journald
  block:
    - name: "6.1.1.4 | PATCH | Ensure journald log file rotation is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/rotation.conf.j2
        dest: /etc/systemd/journald.conf.d/rotation.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'

    - name: "6.1.1.4 | PATCH | Ensure journald log file rotation is configured | comment out current entries"
      when: prelim_systemd_journald_conf.stat.exists
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: "{{ item }}"
        replace: '#\1'
      loop:
        - '^(\s*SystemMaxUse\s*=.*)'
        - '^(\s*SystemKeepFree\s*=.*)'
        - '^(\s*RuntimeMaxUse\s*=.*)'
        - '^(\s*RuntimeKeepFree\s*=.*)'
        - '^(\s*MaxFileSec\s*=.*)'

- name: "6.1.1.5 | PATCH | Ensure journald log file access is configured"
  when: amzn2027cis_rule_6_1_1_5
  tags:
    - level1-server
    - manual
    - patch
    - journald
    - NIST800-53R5_AU-9
    - rule_6.1.1.5
  block:
    - name: "6.1.1.5 | AUDIT | Ensure journald log file access is configured | Get journal file tmpfiles directives"
      ansible.builtin.shell: |
        set -o pipefail
        systemd-tmpfiles --cat-config | grep -P -- '^\s*[^#\s]+\s+/var/log/journal/\S*\.journal\S*\s+'
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_journald_tmpfiles_modes.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_journald_tmpfiles_modes

    - name: "6.1.1.5 | PATCH | Ensure journald log file access is configured | Set tmpfiles directive mode"
      when: discovered_journald_tmpfiles_modes.stdout_lines | select('search', '\.journal\S*\s+0?([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])\s') | list | length > 0
      block:
        - name: "6.1.1.5 | PATCH | Ensure journald log file access is configured | Create local tmpfiles override"
          ansible.builtin.copy:
            src: /usr/lib/tmpfiles.d/systemd.conf
            dest: /etc/tmpfiles.d/systemd.conf
            remote_src: true
            force: false
            owner: root
            group: root
            mode: 'u-x,go-wx'

        - name: "6.1.1.5 | PATCH | Ensure journald log file access is configured | Restrict journal file mode in override"
          ansible.builtin.replace:
            path: /etc/tmpfiles.d/systemd.conf
            regexp: '^(\s*[^#\s]+\s+/var/log/journal/\S*\.journal\S*\s+)0?([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])(\s.*)$'
            replace: '\g<1>0640\g<3>'
          notify: Apply journald tmpfiles

    - name: "6.1.1.5 | PATCH | Ensure journald log file access is configured | Restrict existing journal files"
      ansible.builtin.shell: |
        set -o pipefail
        find /var/log/journal /run/log/journal -type f -name '*.journal*' -perm /0137 -exec chmod u-x,g-wx,o-rwx {} + -print 2>/dev/null || true
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: discovered_journald_file_mode_fix.stdout | length > 0
      register: discovered_journald_file_mode_fix
