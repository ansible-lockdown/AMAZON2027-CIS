---

- name: "4.1.1 | PATCH | Ensure firewalld is installed"
  when: amzn2027cis_rule_4_1_1
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - rule_4.1.1
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.1 | PATCH | Ensure firewalld is installed"
      ansible.builtin.package:
        name: firewalld
        state: present
      register: discovered_firewalld_pkg_added

    - name: "4.1.1 | PATCH | Ensure firewalld is installed | Recapture packages"
      when: discovered_firewalld_pkg_added.skipped is not defined
      ansible.builtin.package_facts:
        manager: auto

- name: "4.1.2 | PATCH | Ensure firewalld backend is configured"
  when: amzn2027cis_rule_4_1_2
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - rule_4.1.2
    - NIST800-53R5_CA-9
  ansible.builtin.lineinfile:
    path: /etc/firewalld/firewalld.conf
    regexp: '^\s*#?\s*FirewallBackend\s*='
    line: FirewallBackend=nftables
  notify: Restart firewalld

- name: "4.1.3 | PATCH | Ensure firewalld.service is configured"
  when: amzn2027cis_rule_4_1_3
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - rule_4.1.3
    - NIST800-53R5_CA-9
  ansible.builtin.systemd:
    name: firewalld
    masked: false
    enabled: true
    state: started

- name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured"
  when: amzn2027cis_rule_4_1_4
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - rule_4.1.4
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Get zone of each network interface"
      ansible.builtin.command: firewall-cmd --get-zone-of-interface={{ item }}
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ amzn2027cis_firewalld_zone_interfaces }}"
      register: discovered_firewalld_interface_zones

    - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Get default zone"
      ansible.builtin.command: firewall-cmd --get-default-zone
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_firewalld_current_default_zone

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Allow ssh before assigning interfaces to a new zone"
      when:
        - amzn2027cis_disruption_high
        - discovered_firewalld_interface_zones.results | map(attribute='stderr', default='') | select('search', 'no zone') | list | length > 0
        - discovered_firewalld_current_default_zone.stdout != amzn2027cis_default_zone
      ansible.posix.firewalld:
        zone: "{{ amzn2027cis_default_zone }}"
        service: ssh
        permanent: true
        immediate: true
        state: enabled

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Assign interfaces with no zone to the default zone"
      when:
        - amzn2027cis_disruption_high
        - item.stderr | default('') is search('no zone')
      ansible.posix.firewalld:
        zone: "{{ amzn2027cis_default_zone }}"
        interface: "{{ item.item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ discovered_firewalld_interface_zones.results }}"

    - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Get active zone targets"
      ansible.builtin.shell: |
        set -o pipefail
        firewall-cmd --get-active-zones | awk '!/^[[:space:]]/ {print $1}' | while read -r l_zone; do
          l_interfaces="$(firewall-cmd --zone="$l_zone" --list-interfaces)"
          if [ -n "$l_interfaces" ] && [ -z "$(tr ' ' '\n' <<< "$l_interfaces" | grep -Pv '^(lo|virbr\S+)?$')" ]; then
            continue
          fi
          l_target="$(firewall-cmd --zone="$l_zone" --list-all | awk '/^[[:space:]]*target:/ {print $2}')"
          l_ptarget="$(firewall-cmd --permanent --zone="$l_zone" --get-target)"
          echo "${l_zone}:${l_target}:${l_ptarget}"
        done
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_firewalld_zone_targets

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Allow ssh before changing zone target"
      when:
        - amzn2027cis_disruption_high
        - item.split(':')[2] | upper == 'ACCEPT'
      ansible.posix.firewalld:
        zone: "{{ item.split(':')[0] }}"
        service: ssh
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ discovered_firewalld_zone_targets.stdout_lines }}"

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Set permanent zone target"
      when:
        - amzn2027cis_disruption_high
        - item.split(':')[2] | upper == 'ACCEPT'
      ansible.posix.firewalld:
        zone: "{{ item.split(':')[0] }}"
        target: "{{ amzn2027cis_firewalld_target }}"
        permanent: true
        state: present
      loop: "{{ discovered_firewalld_zone_targets.stdout_lines }}"
      notify: Restart firewalld

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Load permanent zone target"
      when:
        - amzn2027cis_disruption_high
        - item.split(':')[2] | upper != 'ACCEPT'
        - item.split(':')[1] | upper != item.split(':')[2] | upper
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
      loop: "{{ discovered_firewalld_zone_targets.stdout_lines }}"

    - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Warn if not compliant"
      when:
        - not amzn2027cis_disruption_high
        - (discovered_firewalld_zone_targets.stdout_lines | length == 0) or
          (discovered_firewalld_zone_targets.stdout_lines | select('match', '^[^:]+:(?!ACCEPT:)([^:]+):\\1$') | list | length !=
          discovered_firewalld_zone_targets.stdout_lines | length)
      block:
        - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Warn if not compliant | Message"
          ansible.builtin.debug:
            msg:
              - "Warning!! No active zone found, or an active zone target is ACCEPT or not written as a permanent rule"
              - "Set amzn2027cis_disruption_high: true to set the target to {{ amzn2027cis_firewalld_target }}, or correct manually"
              - "{{ discovered_firewalld_zone_targets.stdout_lines }}"

        - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Warn if not compliant | Warn count"
          ansible.builtin.import_tasks:
            file: warning_facts.yml
          vars:
            warn_control_id: '4.1.4'

- name: "4.1.5 | PATCH | Ensure firewalld loopback traffic is configured"
  when: amzn2027cis_rule_4_1_5
  tags:
    - level2-server
    - manual
    - patch
    - firewalld
    - rule_4.1.5
    - NIST800-53R5_CA-9
  ansible.posix.firewalld:
    zone: "{{ amzn2027cis_loopback_firewall_zone }}"
    interface: lo
    permanent: true
    immediate: true
    state: enabled

- name: "4.1.6 | PATCH | Ensure firewalld loopback source address traffic is configured"
  when: amzn2027cis_rule_4_1_6
  tags:
    - level2-server
    - manual
    - patch
    - firewalld
    - rule_4.1.6
    - NIST800-53R5_CA-9
  ansible.posix.firewalld:
    zone: "{{ amzn2027cis_loopback_firewall_zone }}"
    rich_rule: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - rule family="ipv4" source address="127.0.0.0/8" destination not address="127.0.0.0/8" drop
    - rule family="ipv6" source address="::1" destination not address="::1" drop

- name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured"
  when: amzn2027cis_rule_4_1_7
  tags:
    - level2-server
    - manual
    - audit
    - firewalld
    - rule_4.1.7
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured | Get list of services and ports"
      ansible.builtin.shell: |
        set -o pipefail
        firewall-cmd --get-active-zones | awk '!/^[[:space:]]/ {print $1}' | while read -r l_zone; do firewall-cmd --list-all --zone="$l_zone"; done
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_services_and_ports

    - name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured | Show services and ports"
      ansible.builtin.debug:
        msg:
          - "Warning!! The items below are the services and ports that are accepted, please correct as needed"
          - "{{ discovered_services_and_ports.stdout_lines }}"

    - name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured | Warn count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '4.1.7'

- name: "4.1.8 | PATCH | Ensure firewalld default zone is set to drop"
  when: amzn2027cis_rule_4_1_8
  tags:
    - level2-server
    - manual
    - patch
    - firewalld
    - rule_4.1.8
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.8 | AUDIT | Ensure firewalld default zone is set to drop | Get default zone"
      ansible.builtin.command: firewall-cmd --get-default-zone
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_firewalld_default_zone

    - name: "4.1.8 | PATCH | Ensure firewalld default zone is set to drop | Allow ssh in new default zone"
      when: discovered_firewalld_default_zone.stdout != amzn2027cis_default_zone
      ansible.posix.firewalld:
        zone: "{{ amzn2027cis_default_zone }}"
        service: ssh
        permanent: true
        immediate: true
        state: enabled

    - name: "4.1.8 | PATCH | Ensure firewalld default zone is set to drop | Set default zone"
      when: discovered_firewalld_default_zone.stdout != amzn2027cis_default_zone
      ansible.builtin.command: firewall-cmd --set-default-zone={{ amzn2027cis_default_zone }}
      changed_when: true

    - name: "4.1.8 | AUDIT | Ensure firewalld default zone is set to drop | Warn if not drop"
      when: amzn2027cis_default_zone != 'drop'
      block:
        - name: "4.1.8 | AUDIT | Ensure firewalld default zone is set to drop | Warn if not drop | Message"
          ansible.builtin.debug:
            msg: "Warning!! The firewalld default zone is {{ amzn2027cis_default_zone }}, set amzn2027cis_default_zone: drop to conform to CIS"

        - name: "4.1.8 | AUDIT | Ensure firewalld default zone is set to drop | Warn if not drop | Warn count"
          ansible.builtin.import_tasks:
            file: warning_facts.yml
          vars:
            warn_control_id: '4.1.8'

- name: "4.1.9 | PATCH | Ensure conflicting firewall utilities are not in use with firewalld"
  when: amzn2027cis_rule_4_1_9
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - nftables
    - rule_4.1.9
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.9 | PATCH | Ensure conflicting firewall utilities are not in use with firewalld | Mask nftables.service"
      when: "'nftables' in ansible_facts['packages']"
      ansible.builtin.systemd:
        name: nftables.service
        enabled: false
        state: stopped
        masked: true

    - name: "4.1.9 | PATCH | Ensure conflicting firewall utilities are not in use with firewalld | Remove conflicting packages"
      ansible.builtin.package:
        name:
          - iptables-services
          - ufw
        state: absent
      notify: Restart firewalld

- name: "4.1.10 | PATCH | Ensure firewalld logs denied packets"
  when: amzn2027cis_rule_4_1_10
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - rule_4.1.10
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.10 | AUDIT | Ensure firewalld logs denied packets | Get log denied setting"
      ansible.builtin.command: firewall-cmd --get-log-denied
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_firewalld_log_denied

    - name: "4.1.10 | PATCH | Ensure firewalld logs denied packets | Set log denied"
      when: discovered_firewalld_log_denied.stdout != amzn2027cis_firewalld_log_denied
      ansible.builtin.command: firewall-cmd --set-log-denied={{ amzn2027cis_firewalld_log_denied }}
      changed_when: true

- name: "4.1.11 | PATCH | Ensure firewalld blocks ICMP timestamp requests and replies"
  when: amzn2027cis_rule_4_1_11
  tags:
    - level2-server
    - automated
    - patch
    - firewalld
    - rule_4.1.11
    - NIST800-53R5_CA-9
  block:
    - name: "4.1.11 | AUDIT | Ensure firewalld blocks ICMP timestamp requests and replies | Get active zones with default target"
      ansible.builtin.shell: |
        set -o pipefail
        firewall-cmd --get-active-zones | awk '!/^[[:space:]]/ {print $1}' | while read -r l_zone; do
          if [ "$(firewall-cmd --permanent --zone="$l_zone" --get-target)" = "default" ]; then
            echo "${l_zone}:$(firewall-cmd --permanent --zone="$l_zone" --query-icmp-block-inversion)"
          fi
        done
      args:
        executable: "{{ amzn2027cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_firewalld_icmp_zones

    - name: "4.1.11 | PATCH | Ensure firewalld blocks ICMP timestamp requests and replies | Block timestamp messages"
      ansible.posix.firewalld:
        zone: "{{ item[0].split(':')[0] }}"
        icmp_block: "{{ item[1] }}"
        permanent: true
        immediate: true
        state: "{{ (item[0].split(':')[1] == 'yes') | ternary('disabled', 'enabled') }}"
      loop: "{{ discovered_firewalld_icmp_zones.stdout_lines | product(['timestamp-request', 'timestamp-reply']) | list }}"
