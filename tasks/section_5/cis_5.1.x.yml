- name: "5.1.8 | PATCH | Ensure sshd access is configured"
  when: amzn2027cis_rule_5_1_8
  tags:
    - level1-server
    - automated
    - patch
    - sshd
    - rule_5.1.8
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.8 | PATCH | Ensure sshd access is configured | Add line to sshd_config for allowusers"
      when: "amzn2027cis_sshd_allowusers | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ amzn2027cis_sshd_config_file }}"
        regexp: "^AllowUsers"
        line: "AllowUsers {{ amzn2027cis_sshd_allowusers }}"
        insertbefore: '(?i)^\s*(Include|Match)\s'
        firstmatch: true
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.8 | PATCH | Ensure sshd access is configured | Add line to sshd_config for allowgroups"
      when: "amzn2027cis_sshd_allowgroups | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ amzn2027cis_sshd_config_file }}"
        regexp: "^AllowGroups"
        line: "AllowGroups {{ amzn2027cis_sshd_allowgroups }}"
        insertbefore: '(?i)^\s*(Include|Match)\s'
        firstmatch: true
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.8 | PATCH | Ensure sshd access is configured | Add line to sshd_config for denyusers"
      when: "amzn2027cis_sshd_denyusers | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ amzn2027cis_sshd_config_file }}"
        regexp: "^DenyUsers"
        line: "DenyUsers {{ amzn2027cis_sshd_denyusers }}"
        insertbefore: '(?i)^\s*(Include|Match)\s'
        firstmatch: true
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.8 | PATCH | Ensure sshd access is configured | Add line to sshd_config for denygroups"
      when: "amzn2027cis_sshd_denygroups | length > 0"
      ansible.builtin.lineinfile:
