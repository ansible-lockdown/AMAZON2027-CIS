      ansible.builtin.lineinfile:
        path: "{{ amzn2027cis_sshd_config_file }}"
        regexp: '(?i)^\s*DisableForwarding\s'
        line: 'DisableForwarding yes'
        insertbefore: '(?i)^\s*(Include|Match)\s'
        firstmatch: true
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.11 | PATCH | Ensure sshd DisableForwarding is enabled | override"
      when: prelim_sshd_50_redhat_file.stat.exists
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-redhat.conf
        regexp: (?i)^(#|)\s*X11Forwarding
        line: 'X11Forwarding {{ amzn2027cis_sshd_x11forwarding }}'
        validate: sshd -t -f %s
      notify: Restart sshd

