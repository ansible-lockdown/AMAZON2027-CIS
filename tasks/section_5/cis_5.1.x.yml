---

- name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured"
  when: amzn2027cis_rule_5_1_1
  tags:
    - level1-server
    - automated
    - patch
    - sshd
    - permissions
    - rule_5.1.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured | sshd_config"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: 'u-x,go-rwx'

    - name: "5.1.1 | AUDIT | Ensure access to /etc/ssh/sshd_config is configured | Find sshd_config.d conf files"
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: '*.conf'
        file_type: file
      register: discovered_sshd_conf_d_files

    - name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured | sshd_config.d conf files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      loop: "{{ discovered_sshd_conf_d_files.files }}"

- name: "5.1.2 | PATCH | Ensure access to /etc/ssh/sshd_config.d/ directory is configured"
  when: amzn2027cis_rule_5_1_2
  tags:
    - level1-server
    - automated
    - patch
    - sshd
    - permissions
    - rule_5.1.2
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: 'go-rwx'

- name: "5.1.3 | PATCH | Ensure access to SSH private host key files is configured"
  when: amzn2027cis_rule_5_1_3
  tags:
    - level1-server
    - automated
    - patch
    - sshd
    - permissions
    - CCI-000366
    - NIST800-53R5_CM-6
    - rule_5.1.3
  block:
    - name: "5.1.3 | AUDIT | Ensure access to SSH private host key files is configured | Find the SSH private host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
        recurse: true
        file_type: any
      register: discovered_ssh_private_host_key

    - name: "5.1.3 | PATCH | Ensure access to SSH private host key files is configured | Set permissions on SSH private host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ 'ssh_keys' if (item.gr_name == 'ssh_keys') else 'root' }}"
        mode: "{{ 'u-x,g-wx,o-rwx' if (item.gr_name == 'ssh_keys') else 'u-x,go-rwx' }}"
      loop: "{{ discovered_ssh_private_host_key.files }}"

- name: "5.1.4 | PATCH | Ensure access to SSH public host key files is configured"
  when: amzn2027cis_rule_5_1_4
  tags:
    - level1-server
    - automated
    - patch
    - sshd
    - rule_5.1.4
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.4 | AUDIT | Ensure access to SSH public host key files is configured | Find the SSH public host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
        recurse: true
        file_type: any
      register: discovered_ssh_public_host_key

    - name: "5.1.4 | PATCH | Ensure access to SSH public host key files is configured | Set permissions on SSH public host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop: "{{ discovered_ssh_public_host_key.files }}"

- name: "5.1.5 | PATCH | Ensure sshd Ciphers are configured"
  when:
    - amzn2027cis_rule_5_1_5
    - "'NO-SSHWEAKCIPHERS' not in amzn2027cis_crypto_policy_module"
    - amzn2027cis_crypto_policy_ansiblemanaged
  tags:
    - level1-server
    - automated
    - patch
    - crypto
    - rule_5.1.5
    - NIST800-53R5_SC-8
  block:
    - name: "5.1.5 | PATCH | Ensure sshd Ciphers are configured | Add submodule exclusion"
      ansible.builtin.template:
        src: etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod.j2
        dest: /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod
        owner: root
        group: root
        mode: 'g-wx,o-rwx'
      notify:
        - Update Crypto Policy
        - Set Crypto Policy

    - name: "5.1.5 | PATCH | Ensure sshd Ciphers are configured | submodule to crypto policy modules"
      ansible.builtin.set_fact:
        amzn2027cis_crypto_policy_module: "{{ amzn2027cis_crypto_policy_module + ':NO-SSHWEAKCIPHERS' }}"

