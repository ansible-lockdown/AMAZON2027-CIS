---

- name: "5.3.1.1 | PATCH | Ensure latest version of pam is installed"
  when:
    - amzn2027cis_rule_5_3_1_1
    - "'pam' not in ansible_facts['packages'] or
      ansible_facts['packages']['pam'][0]['version'] is version('1.5.1', '<') or
      (ansible_facts['packages']['pam'][0]['version'] is version('1.5.1', '==') and
      ansible_facts['packages']['pam'][0]['release'].split('.')[0] | int < 8)"
  tags:
    - level1-server
    - automated
    - patch
    - pam
    - rule_5.3.1.1
    - NIST800-53R5_SI-2
  ansible.builtin.package:
    name: pam
    state: latest

- name: "5.3.1.2 | PATCH | Ensure latest version of authselect is installed"
  when:
    - amzn2027cis_rule_5_3_1_2
    - amzn2027cis_authselect_pkg_update
    - "'authselect' not in ansible_facts['packages'] or
      ansible_facts['packages']['authselect'][0]['version'] is version('1.2.5', '<') or
      (ansible_facts['packages']['authselect'][0]['version'] is version('1.2.5', '==') and
      ansible_facts['packages']['authselect'][0]['release'].split('.')[0] | int < 1)"
  tags:
    - level1-server
    - automated
    - patch
    - pam
    - rule_5.3.1.2
    - NIST800-53R5_SI-2
  ansible.builtin.package:
    name: authselect
    state: latest

- name: "5.3.1.3 | PATCH | Ensure latest version of libpwquality is installed"
  when:
    - amzn2027cis_rule_5_3_1_3
    - "'libpwquality' not in ansible_facts['packages'] or
      ansible_facts['packages']['libpwquality'][0]['version'] is version('1.4.4', '<') or
      (ansible_facts['packages']['libpwquality'][0]['version'] is version('1.4.4', '==') and
      ansible_facts['packages']['libpwquality'][0]['release'].split('.')[0] | int < 6)"
  tags:
    - level1-server
    - automated
    - patch
    - pam
    - rule_5.3.1.3
    - NIST800-53R5_SI-2
  ansible.builtin.package:
    name: libpwquality
    state: latest
