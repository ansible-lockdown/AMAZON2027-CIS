    - avahi
    - NIST800-53R5_SI-4
    - rule_2.1.2
  block:
    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use | Remove package"
      when:
        - not amzn2027cis_avahi_server
        - not amzn2027cis_avahi_mask
      ansible.builtin.package:
        name: "{{ avahi_pkgs }}"
        state: absent

    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use | Mask service"
      when:
        - not amzn2027cis_avahi_server
        - amzn2027cis_avahi_mask
      notify: Systemd daemon reload
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: "{{ avahi_installed | ternary(false, omit) }}"
        state: "{{ avahi_installed | ternary('stopped', omit) }}"
        masked: true
      loop: "{{ avahi_services }}"
      vars:
        avahi_installed: "{{ (avahi_pkgs | select('in', ansible_facts['packages']) | list | length) > 0 }}"

