- name: "2.1.17 | PATCH | Ensure mail transfer agents are configured for local-only mode"
  when:
    - not amzn2027cis_is_mail_server
    - "'postfix' in ansible_facts['packages']"
    - amzn2027cis_rule_2_1_17
  tags:
    - level1-server
    - automated
    - patch
    - postfix
    - NIST800-53R5_CM-7
    - rule_2.1.17
  notify: Restart postfix
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: "^(#)?inet_interfaces"
    line: "inet_interfaces = loopback-only"

- name: "2.1.18 | PATCH | Ensure a graphical user interface is not in use"
  when:
    - amzn2027cis_rule_2_1_18
    - not amzn2027cis_gui
  tags:
    - level2-server
    - automated
    - patch
    - gui
    - gdm
    - NIST800-53R5_CM-7
    - rule_2.1.18
  block:
    - name: "2.1.18 | PATCH | Ensure a graphical user interface is not in use | Remove graphical user interface packages"
      ansible.builtin.package:
        name:
          - gdm
          - gnome-shell
          - tigervnc-server
        state: absent

    - name: "2.1.18 | AUDIT | Ensure a graphical user interface is not in use | Get default target"
      ansible.builtin.command: systemctl get-default
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_systemd_default_target

    - name: "2.1.18 | PATCH | Ensure a graphical user interface is not in use | Set default target to multi-user"
      when:
        - not system_is_container
        - discovered_systemd_default_target.stdout == 'graphical.target'
      ansible.builtin.command: systemctl set-default multi-user.target
      changed_when: true

- name: "2.1.19 | PATCH | Ensure X window server services are not in use"
  when:
    - amzn2027cis_rule_2_1_19
    - not amzn2027cis_xwindow_server
    - not amzn2027cis_gui
  tags:
    - level2-server
    - automated
    - patch
    - xwindow
    - NIST800-53R5_CM-11
    - rule_2.1.19
  ansible.builtin.package:
    name:
      - xorg-x11-server-common
      - tigervnc-server-minimal
    state: absent

- name: "2.1.20 | PATCH | Ensure Xwayland is not in use"
  when:
    - amzn2027cis_rule_2_1_20
    - not amzn2027cis_xwindow_server
    - not amzn2027cis_gui
    - "'xorg-x11-server-Xwayland' in ansible_facts['packages']"
  tags:
    - level2-server
    - automated
    - patch
    - xwayland
    - NIST800-53R5_CM-11
    - NIST800-53R5_CM-7
    - rule_2.1.20
  block:
    - name: "2.1.20 | AUDIT | Ensure Xwayland is not in use | Packages that require Xwayland"
      ansible.builtin.command: dnf repoquery --installed --whatrequires xorg-x11-server-Xwayland --qf '%{name}'
      changed_when: false
      check_mode: false
      register: discovered_xwayland_dependants

    - name: "2.1.20 | PATCH | Ensure Xwayland is not in use | Remove package"
      when: discovered_xwayland_dependants.stdout_lines | length == 0
      ansible.builtin.package:
        name: xorg-x11-server-Xwayland
        state: absent

    - name: "2.1.20 | AUDIT | Ensure Xwayland is not in use | Warn required dependency"
      when: discovered_xwayland_dependants.stdout_lines | length > 0
      ansible.builtin.debug:
        msg: "{{ ['Warning!! xorg-x11-server-Xwayland is required by the packages below. Document the exception or remove them'] + discovered_xwayland_dependants.stdout_lines }}"

    - name: "2.1.20 | AUDIT | Ensure Xwayland is not in use | Warn Count"
      when: discovered_xwayland_dependants.stdout_lines | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.1.20'

- name: "2.1.21 | AUDIT | Ensure only approved services are listening on a network interface"
  when: amzn2027cis_rule_2_1_21
  tags:
    - level1-server
    - manual
    - audit
    - services
    - NIST800-53R5_CM-7
    - rule_2.1.21
  block:
    - name: "2.1.21 | AUDIT | Ensure only approved services are listening on a network interface | Get list of services"
      ansible.builtin.command: systemctl list-units --type=service  # noqa command-instead-of-module
      changed_when: false
      failed_when: discovered_running_services.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_running_services

    - name: "2.1.21 | AUDIT | Ensure only approved services are listening on a network interface | Display list of services"
      ansible.builtin.debug:
        msg:
          - "Warning!! Below are the list of services, both active and inactive"
          - "Please review to make sure all are essential"
          - "{{ discovered_running_services.stdout_lines }}"

    - name: "2.1.21 | AUDIT | Ensure only approved services are listening on a network interface | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.1.21'
