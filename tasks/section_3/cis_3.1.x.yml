---

- name: "3.1.1 | PATCH | Ensure IPv6 status is identified"
  when:
    - not amzn2027cis_ipv6_required
    - amzn2027cis_rule_3_1_1
  tags:
    - level1-server
    - manual
    - patch
    - ipv6
    - networking
    - rule_3.1.1
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Set vars for sysctl template"
      when: "'sysctl' in amzn2027cis_ipv6_disable_method"
      ansible.builtin.set_fact:
        amzn2027cis_sysctl_update: true
        amzn2027cis_flush_ipv6_route: true

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Message out implementation info"
      when: "'sysctl' in amzn2027cis_ipv6_disable_method"
      ansible.builtin.debug:
        msg: "Control being set via Handler 'update sysctl' which writes to /etc/sysctl.d/60-disable_ipv6.conf"

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Find IPv6 status"
      when: "'kernel' in amzn2027cis_ipv6_disable_method"
      ansible.builtin.command: grubby --info=ALL
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_amzn2027cis_3_1_1_ipv6_status

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Disable IPV6 via Kernel"
      when:
        - "'kernel' in amzn2027cis_ipv6_disable_method"
        - "'ipv6.disable=1' not in discovered_amzn2027cis_3_1_1_ipv6_status.stdout"
      ansible.builtin.command: grubby --update-kernel=ALL --args="ipv6.disable=1"
      changed_when: discovered_amzn2027cis_3_1_1_ipv6_status.rc == 0

- name: "3.1.2 | PATCH | Ensure bluetooth services are not in use"
  when: amzn2027cis_rule_3_1_2
  tags:
    - level2-server
    - automated
    - patch
    - bluetooth
    - rule_3.1.2
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.2 | PATCH | Ensure bluetooth services are not in use | pkg"
      when:
        - not amzn2027cis_bluetooth_service
        - not amzn2027cis_bluetooth_mask
      ansible.builtin.package:
        name: bluez
        state: absent

    - name: "3.1.2 | PATCH | Ensure bluetooth services are not in use | mask"
      when:
        - not amzn2027cis_bluetooth_service
        - amzn2027cis_bluetooth_mask
      notify: Systemd daemon reload
      ansible.builtin.systemd:
        name: bluetooth.service
        enabled: "{{ ('bluez' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('bluez' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true
