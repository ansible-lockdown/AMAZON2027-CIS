- name: "3.3.1.1 | PATCH | Ensure net.ipv4.ip_forward is configured"
  when:
    - not amzn2027cis_is_router
    - amzn2027cis_rule_3_3_1_1
  tags:
    - level2-server
    - automated
    - sysctl
    - patch
    - CCI-000366
    - NIST800-53R5_CM-6
    - rule_3.3.1.1
  block:
    - name: "3.3.1.1 | PATCH | Ensure net.ipv4.ip_forward is configured | Set Fact"
      ansible.builtin.set_fact:
        amzn2027cis_sysctl_update: true
        amzn2027cis_flush_ipv4_route: true

    - name: "3.3.1.1 | PATCH | Ensure net.ipv4.ip_forward is configured | Message out implementation info"
      ansible.builtin.debug:
        msg: "Control being set via post task 'Update sysctl' which writes to /etc/sysctl.d/60-netipv4_sysctl.conf"

