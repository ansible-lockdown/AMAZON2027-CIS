---

- name: "3.2.1 | PATCH | Ensure rds kernel module is not available"
  when: amzn2027cis_rule_3_2_1
  tags:
    - level1-server
    - automated
    - patch
    - rule_3.2.1
    - rds
    - CCI-000381
    - NIST800-53R5_CM-7
    - NIST800-53R5_SI-4
  block:
    - name: "3.2.1 | PATCH | Ensure rds kernel module is not available | install"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/60-rds.conf
        regexp: '^\s*#?\s*install\s+rds(\s|$)'
        line: install rds /bin/false
        create: true
        mode: 'u-x,go-rwx'

    - name: "3.2.1 | PATCH | Ensure rds kernel module is not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/60-rds.conf
        regexp: '^\s*#?\s*blacklist\s+rds(\s|$)'
        line: blacklist rds
        create: true
        mode: 'u-x,go-rwx'

    - name: "3.2.1 | PATCH | Ensure rds kernel module is not available | unload"
      when: not system_is_container
      community.general.modprobe:
        name: rds
        state: absent

